<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A75A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B68A3E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="250" cy="250" r="240" fill="url(#goldGlow)" />
  
  <g stroke="#B68A3E" stroke-width="1.5" fill="none" opacity="0.85">
    <!-- Outer ornate rings -->
    <circle cx="250" cy="250" r="230" stroke-dasharray="4 6" />
    <circle cx="250" cy="250" r="220" stroke-width="2" />
    <circle cx="250" cy="250" r="205" />

    <!-- 16 Outer Lotus Petals -->
    <g id="outerPetals">
      <!-- Repeated in JS / transform -->
      <path d="M250 30 C 230 80, 230 140, 250 170 C 270 140, 270 80, 250 30 Z" />
      <path d="M250 30 C 240 70, 245 130, 250 170 C 255 130, 260 70, 250 30 Z" fill="#B68A3E" fill-opacity="0.1" />
    </g>

    <!-- Rotate Outer Petals 16 Times -->
    <use href="#outerPetals" transform="rotate(22.5 250 250)" />
    <use href="#outerPetals" transform="rotate(45 250 250)" />
    <use href="#outerPetals" transform="rotate(67.5 250 250)" />
    <use href="#outerPetals" transform="rotate(90 250 250)" />
    <use href="#outerPetals" transform="rotate(112.5 250 250)" />
    <use href="#outerPetals" transform="rotate(135 250 250)" />
    <use href="#outerPetals" transform="rotate(157.5 250 250)" />
    <use href="#outerPetals" transform="rotate(180 250 250)" />
    <use href="#outerPetals" transform="rotate(202.5 250 250)" />
    <use href="#outerPetals" transform="rotate(225 250 250)" />
    <use href="#outerPetals" transform="rotate(247.5 250 250)" />
    <use href="#outerPetals" transform="rotate(270 250 250)" />
    <use href="#outerPetals" transform="rotate(292.5 250 250)" />
    <use href="#outerPetals" transform="rotate(315 250 250)" />
    <use href="#outerPetals" transform="rotate(337.5 250 250)" />

    <!-- Mid Ring -->
    <circle cx="250" cy="250" r="150" stroke-width="2" stroke="#6E1423" />
    <circle cx="250" cy="250" r="140" stroke-dasharray="3 3" />

    <!-- Inner Lotus 8 Petals Maroon -->
    <g id="innerPetals" stroke="#6E1423" stroke-width="1.8">
      <path d="M250 110 C 235 150, 235 190, 250 210 C 265 190, 265 150, 250 110 Z" fill="#6E1423" fill-opacity="0.15" />
      <circle cx="250" cy="120" r="4" fill="#B68A3E" stroke="none" />
    </g>
    <use href="#innerPetals" transform="rotate(45 250 250)" />
    <use href="#innerPetals" transform="rotate(90 250 250)" />
    <use href="#innerPetals" transform="rotate(135 250 250)" />
    <use href="#innerPetals" transform="rotate(180 250 250)" />
    <use href="#innerPetals" transform="rotate(225 250 250)" />
    <use href="#innerPetals" transform="rotate(270 250 250)" />
    <use href="#innerPetals" transform="rotate(315 250 250)" />

    <!-- Core Sacred Geometry -->
    <circle cx="250" cy="250" r="80" stroke="#9C6B36" stroke-width="1.5" />
    <circle cx="250" cy="250" r="70" stroke="#B68A3E" stroke-width="1" />
    
    <!-- Central Star / Yantra -->
    <polygon points="250,175 295,275 205,275" stroke="#6E1423" stroke-width="1.5" fill="#6E1423" fill-opacity="0.1" />
    <polygon points="250,325 295,225 205,225" stroke="#6E1423" stroke-width="1.5" fill="#6E1423" fill-opacity="0.1" />
    
    <!-- Center Bindu -->
    <circle cx="250" cy="250" r="12" fill="#B68A3E" stroke="#6E1423" stroke-width="2" />
    <circle cx="250" cy="250" r="4" fill="#6E1423" />
  </g>
</svg>
