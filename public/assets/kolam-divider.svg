<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 40" width="100%" height="100%">
  <g stroke="#B68A3E" stroke-width="1.5" fill="none">
    <!-- Left Gradient Line -->
    <path d="M 0 20 L 90 20" stroke-opacity="0.5" stroke-dasharray="2 2" />
    <path d="M 90 20 L 110 20" />
    
    <!-- Central Kolam Loop Pattern -->
    <path d="M 110 20 Q 125 2 140 20 Q 155 38 170 20 Q 185 2 200 20 Q 215 38 230 20" stroke="#6E1423" stroke-width="2" />
    <path d="M 110 20 Q 125 38 140 20 Q 155 2 170 20 Q 185 38 200 20 Q 215 2 230 20" stroke="#B68A3E" stroke-width="1.5" />
    
    <circle cx="140" cy="20" r="3" fill="#6E1423" />
    <circle cx="170" cy="20" r="4.5" fill="#B68A3E" stroke="#6E1423" stroke-width="1" />
    <circle cx="200" cy="20" r="3" fill="#6E1423" />
    
    <!-- Right Gradient Line -->
    <path d="M 230 20 L 250 20" />
    <path d="M 250 20 L 300 20" stroke-opacity="0.5" stroke-dasharray="2 2" />
  </g>
</svg>
